[project]
name = "digitalfamilyanalysis"
version = "0.1.0"
description = "Analysis for the Digital Family manuscript"
authors = [
    {name = "Aaron Scott"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jupyterlab (>=4.4.5,<5.0.0)",
    "networkx (>=3.5,<4.0)",
    "fa2-modified (>=0.3.10,<0.4.0)",
    "pandas-stubs (>=2.3.0.250703,<3.0.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "mypy (>=1.17.1,<2.0.0)",
    "leidenalg (>=0.10.2,<0.11.0)",
    "imbalanced-learn (>=0.14.0,<0.15.0)",
    "numba (>=0.61.2,<0.62.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "sktime (>=0.38.4,<0.39.0)",
    "alphabase (>=1.6.2,<2.0.0)",
    "peptdeep (>=1.4.0,<2.0.0)",
    "biopython (>=1.85,<2.0)",
    "streamlit (>=1.48.1,<2.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "dpks @ git+https://github.com/InfectionMedicineProteomics/DPKS@dpksml",
    "muon (>=0.1.7,<0.2.0)",
    "mofapy2 (>=0.7.2,<0.8.0)",
    "mofax (>=0.3.7,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
