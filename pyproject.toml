[project]
name = "digitalfamilyanalysis"
version = "0.1.0"
description = "Analysis for the Digital Family manuscript"
authors = [
    {name = "Aaron Scott"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.3.1,<3.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jupyterlab (>=4.4.5,<5.0.0)",
    "networkx (>=3.5,<4.0)",
    "fa2-modified (>=0.3.10,<0.4.0)",
    "pandas-stubs (>=2.3.0.250703,<3.0.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "mypy (>=1.17.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
